; nodespot configuration (Asterisk-style INI; ";" starts a comment).
; The values below are the built-in defaults. Edit and run:
;   sudo systemctl restart nodespot
; This file is a conffile: package upgrades never overwrite your edits.

[server]
; Address the web UI listens on: ":PORT" or "ADDR:PORT". The default port is
; 8080. Rerunning the installer with NODESPOT_PORT=<port> changes this line and
; opens the port in firewalld for you. If you edit it by hand, open the port
; yourself (firewalld: sudo firewall-cmd --permanent --add-port=<port>/tcp &&
; sudo firewall-cmd --reload); a package upgrade also opens the configured port
; in firewalld. The packaged firewalld service "nodespot" covers TCP 8080 only.
; The service runs with no capabilities, so ports below 1024 need a systemd
; drop-in granting CAP_NET_BIND_SERVICE. For port 80 use System, Web port in
; the web UI, or run the installer with NODESPOT_PORT=80 (or NODESPOT_TAKEOVER=1): they
; write the drop-in and this line for you.
listen = :8080
; Database, sessions, setup code. Owned by the nodespot user.
datadir = /var/lib/nodespot

[node]
; The native node (nodespot-node.service). Network passwords live in its own
; config file, never here. Optional overrides; the built-in defaults apply
; while these are commented out.
;socket = /run/nodespot-node/control.sock
;config = /etc/nodespot/node.json

[nodelist]
; Where node names (callsign, description, location) come from.
; Optional override; the built-in default is https://allmondb.allstarlink.org/
;url = https://allmondb.allstarlink.org/
refresh = 24h

[helper]
; Socket of the privileged helper (nodespot-helper.socket) used for updates.
socket = /run/nodespot/helper.sock

[updates]
; Base URL of the apt repository; /latest.json provides release notes.
; Leave empty to disable release notes. Optional override: the built-in default
; (https://w1jar.github.io/nodespot) applies while this line is commented out.
;url = https://w1jar.github.io/nodespot

[favstats]
; Favorites activity scan (off by default; switched on in the Favorites header).
; Queries <url>/api/stats/<node> for each favorite node number (regular
; numbers 2000..999999; EchoLink and private numbers are skipped), at most
; "rate" requests per minute (1..25, default 20), only while someone has the
; panel open. The rate is a ceiling: after an HTTP 429 the rate in use is
; halved (not below 3/min) and creeps back up by 1/min per 20 successful requests.
; "log = true" writes one journal line per request (node, status, time, rate,
; Retry-After; never any response data) to help diagnose rate limiting.
; Optional overrides; the built-in defaults apply while these are commented out.
;url = https://stats.allstarlink.org
;rate = 20
;log = false
