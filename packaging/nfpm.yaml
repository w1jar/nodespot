# nfpm package definition (https://nfpm.goreleaser.com). Driven by `make deb`,
# which exports:
#   VERSION    Debian version (git tag without the leading "v", or 0.0.0+dev.N.g<sha> without any tag)
#   ARCH       Debian architecture: arm64, amd64 or armhf (32-bit ARMv6 hard-float, built with GOARM=6)
#   (@BUILD_DIR@ in contents is replaced by the Makefile with the directory
#   holding the cross-compiled binaries; nfpm does not expand env vars there.)
name: nodespot
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: nodespot <noreply@users.noreply.github.com>
homepage: https://w1jar.github.io/nodespot/
description: |
  Native radio node with a web control panel.
  One radio, one network mode at a time (AllStarLink, EchoLink or a digital
  mode), chosen and watched from a browser. The node (nodespot-node) runs on its
  own, without Asterisk; the panel talks to it over a local socket. A small
  root helper performs package updates and backups on request.

depends:
  - systemd
  - adduser
  - git

contents:
  - src: "@BUILD_DIR@/nodespot"
    dst: /usr/bin/nodespot
    file_info:
      mode: 0755
  - src: "@BUILD_DIR@/nodespot-helper"
    dst: /usr/libexec/nodespot/nodespot-helper
    file_info:
      mode: 0755
  - src: "@BUILD_DIR@/nodespot-node"
    dst: /usr/libexec/nodespot/nodespot-node
    file_info:
      mode: 0755
  - src: packaging/nodespot.conf
    dst: /etc/nodespot/nodespot.conf
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot.service
    dst: /lib/systemd/system/nodespot.service
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot-helper.socket
    dst: /lib/systemd/system/nodespot-helper.socket
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot-helper.service
    dst: /lib/systemd/system/nodespot-helper.service
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot-node.service
    dst: /lib/systemd/system/nodespot-node.service
    file_info:
      mode: 0644
  - src: packaging/udev/60-nodespot-node.rules
    dst: /lib/udev/rules.d/60-nodespot-node.rules
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot-wifi-watchdog.service
    dst: /lib/systemd/system/nodespot-wifi-watchdog.service
    file_info:
      mode: 0644
  - src: packaging/systemd/nodespot-wifi-watchdog.timer
    dst: /lib/systemd/system/nodespot-wifi-watchdog.timer
    file_info:
      mode: 0644
  - src: packaging/firewalld/nodespot.xml
    dst: /usr/lib/firewalld/services/nodespot.xml
    file_info:
      mode: 0644
  - src: packaging/copyright
    dst: /usr/share/doc/nodespot/copyright
    file_info:
      mode: 0644
  - src: packaging/THIRD-PARTY-NOTICES
    dst: /usr/share/doc/nodespot/THIRD-PARTY-NOTICES
    file_info:
      mode: 0644
  - src: packaging/README.package
    dst: /usr/share/doc/nodespot/README
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
  postremove: packaging/scripts/postrm.sh

deb:
  compression: xz
