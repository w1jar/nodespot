name: Bug report
description: Something in nodespot does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Tip: **Settings, About, Report a bug** in nodespot opens this form with the versions and hardware filled in.
        Security problems: do not use this form, see [SECURITY.md](https://github.com/w1jar/nodespot/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: nodespot version
      description: Settings, About, or `nodespot --version`.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: asl
    attributes:
      label: ASL3 / Asterisk version
      description: Settings, About, or `asterisk -rx "core show version"`.
      placeholder: "22.10.1+asl3-3.10.8-1.deb12"
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      options:
        - Raspberry Pi 5
        - Raspberry Pi 4
        - Raspberry Pi 3
        - Raspberry Pi Zero 2 W
        - Other ARM board
        - PC (amd64)
        - Other
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Debian GNU/Linux 13 (trixie) or 12 (bookworm), Raspberry Pi OS"
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you see? Screenshots are welcome (hide private data).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Paste the output of `journalctl -u nodespot -n 100 --no-pager`, or attach the diagnostics file from Settings, About, Download diagnostics (drag the .txt file into this box).
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords and other private data
          required: true
