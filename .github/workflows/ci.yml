name: CI

on:
  push:
    # try/** : experiment branches. The debs of the run are a test build to install
    # by hand on one node (download from the run page); nothing is published.
    branches: [main, 'release/**', 'try/**']
    # Text-only changes need no build (release notes are read at tag time).
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    branches: [main, 'release/**']
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']

# A newer push to the same branch cancels the older run; every main run completes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    # Own branches are covered by their push run; pull_request only for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history (and tags), for the package version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: web check and build (embedded UI)
        run: |
          cd web
          npm ci
          npm run check
          npm test
      - name: Build debs (arm64, amd64; nothing is published)
        run: make debs
      - name: go test -race
        run: go test -race ./...
      - name: Package contents
        run: |
          for f in dist/*.deb; do dpkg-deb -I "$f" | head -12; dpkg-deb -c "$f"; done
          for f in dist/*.deb; do
            for p in usr/libexec/nodespot/nodespot-node lib/systemd/system/nodespot-node.service lib/udev/rules.d/60-nodespot-node.rules; do
              dpkg-deb -c "$f" | grep -q "\./$p\$" || { echo "::error::$f lacks $p"; exit 1; }
            done
          done
      - name: Artifact name
        id: art
        run: echo "name=debs-${GITHUB_REF_NAME//\//-}-$(make -s print-version)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/*.deb
          retention-days: 7
