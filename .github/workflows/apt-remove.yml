name: Remove from beta

# One-off cleanup of the beta suite of the apt repository: delete the packages
# whose Debian version matches a glob (for example 2.0.0~beta*) from the beta
# pool, regenerate both suites' indexes and sign them again. DRY RUN BY DEFAULT:
# without "apply" it only lists what would be deleted. Only unpromoted (beta
# pool) packages can be removed; the stable pool is never touched.
#
# "keep_version" must still be in the pool afterwards, otherwise nothing is
# done. The workflow refuses to empty the repository.
on:
  workflow_dispatch:
    inputs:
      glob:
        description: 'Debian version glob (bash pattern) of the beta packages to delete'
        required: true
        default: '2.0.0~beta*'
        type: string
      keep_version:
        description: 'Version that must still be in the apt repository afterwards'
        required: true
        default: '1.1.16'
        type: string
      apply:
        description: 'Really delete (leave off for a dry run that only lists)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Public apt repository (gh-pages branch of this repository): keep in sync with
  # release.yml and the Makefile.
  APT_OWNER: w1jar
  APT_REPO: nodespot
  APT_URL: https://w1jar.github.io/nodespot

jobs:
  remove:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch (apt repository)
    concurrency:
      group: publish-apt
      cancel-in-progress: false
    steps:
      - name: Tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils
      - uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 0
      - name: Check out the apt repository (gh-pages branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: code/packaging/apt-checkout.sh apt-repo
      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format long
      - name: Remove (dry run unless apply is ticked)
        env:
          REMOVE_GLOB: ${{ inputs.glob }}
          REQUIRE_VERSION: ${{ inputs.keep_version }}
          APPLY: ${{ inputs.apply }}
          CODE_DIR: ${{ github.workspace }}/code
        run: |
          flags=()
          if [ "$APPLY" = "true" ]; then flags+=(--apply); fi
          code/packaging/publish-apt.sh --remove "$REMOVE_GLOB" "${flags[@]}" apt-repo
      - name: Commit and push
        if: ${{ inputs.apply }}
        working-directory: apt-repo
        run: |
          git config user.name "nodespot-release"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "nodespot: remove beta packages matching ${REMOVE_GLOB}"
            git push origin HEAD:gh-pages
          fi
        env:
          REMOVE_GLOB: ${{ inputs.glob }}
